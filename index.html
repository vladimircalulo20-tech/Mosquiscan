<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MosquiScan</title>
</head>
<body>

    <h1>MosquiScan</h1>
    <p>Drone-Assisted Mosquito Breeding-Site Monitoring System</p>

    <hr>

    <h2>Upload Drone Image</h2>
    <input type="file" accept="image/*">

    <h2>AI Analysis Result</h2>
    <p>No image analyzed yet.</p>

    <h2>Location Information</h2>
    <label>Latitude:</label>
    <input type="text" placeholder="Enter latitude">
    <br><br>

    <label>Longitude:</label>
    <input type="text" placeholder="Enter longitude">
    <br><br>

    <label>Date:</label>
    <input type="date">
    <br><br>

    <label>Notes:</label>
    <textarea placeholder="Enter notes"></textarea>

    <h2>Activity Log</h2>
    <p>No records yet.</p>

    <h2>Map</h2>
    <p>The monitoring map will be added in the next steps.</p>

</body>
</html>
