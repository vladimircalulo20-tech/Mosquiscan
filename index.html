<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MosquiScan</title>

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet Map CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3tR7p8D6kQ6k1z5Q5Q5Q5Q5Q5Q5Q="
        crossorigin=""
    >
</head>

    <div class="container">

        <div class="card">
            <h2>Upload Drone Image</h2>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <img id="imagePreview" alt="Uploaded drone image preview">

            <br>

            <button id="analyzeButton">
                Analyze Image
            </button>
        </div>

        <div class="card">
            <h2>AI Analysis Result</h2>

            <div class="result">
                <p id="resultText">
                    No image analyzed yet.
                </p>
            </div>
        </div>

        <div class="card">
            <h2>Location Information</h2>

            <label for="latitude">Latitude</label>
            <input
                type="text"
                id="latitude"
                placeholder="Enter latitude"
            >

            <label for="longitude">Longitude</label>
            <input
                type="text"
                id="longitude"
                placeholder="Enter longitude"
            >

            <label for="date">Date</label>
            <input
                type="date"
                id="date"
            >

            <label for="notes">Notes</label>
            <textarea
                id="notes"
                placeholder="Enter notes about the inspected location"
            ></textarea>

            <button id="saveButton">
                Save Record
            </button>
        </div>

        <div class="card">
            <h2>Activity Log</h2>
            <p id="logMessage">No records yet.</p>
        </div>

        <div class="card">
            <h2>Monitoring Map</h2>

            <div class="map-placeholder">
                The interactive map will be added here.
            </div>
        </div>

    </div>

    <footer>
        MosquiScan | Research Prototype
    </footer>

    <script src="script.js"></script>

</body>
</html>
